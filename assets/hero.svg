<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Portfolio de Andrés Felipe Joya Buitrago">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1819"/><stop offset="1" stop-color="#11302f"/>
  </linearGradient>
  <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8f2b2b"/><stop offset="1" stop-color="#e05a5a"/>
  </linearGradient>
</defs>
<rect width="1000" height="440" rx="18" fill="url(#g)"/>
<!-- tablones de fondo -->
<path d="M430 440 L520 250 L760 250 L720 440 Z" fill="#164d4d" opacity=".55"/>
<path d="M470 440 L545 280 L735 280 L705 440 Z" fill="#1a6060" opacity=".45"/>
<!-- tentáculos -->
<g transform="translate(-30,440)"><path d="M0 20 C60 -25 110 10 160 -12 C190 -26 215 -10 240 -22" fill="none" stroke="#d64545" stroke-width="26" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 0 0;3 0 0;0 0 0;-3 0 0;0 0 0" dur="8s" begin="0s" repeatCount="indefinite"/></path></g>
<g transform="translate(1040,150)"><path d="M0 0 C-80 40 -90 120 -40 170 C-10 205 -70 250 -120 230" fill="none" stroke="#d64545" stroke-width="34" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 0 0;3 0 0;0 0 0;-3 0 0;0 0 0" dur="9s" begin="1s" repeatCount="indefinite"/></path></g>
<g transform="translate(980,380)"><path d="M0 0 C-60 -30 -110 10 -150 -20" fill="none" stroke="#d64545" stroke-width="22" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 0 0;4 0 0;0 0 0;-4 0 0;0 0 0" dur="6s" begin="2s" repeatCount="indefinite"/></path></g>
<g transform="translate(14,10)" opacity=".9"><path d="M0 0 C30 18 24 44 -6 56" fill="none" stroke="#d64545" stroke-width="18" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 0 0;3 0 0;0 0 0;-3 0 0;0 0 0" dur="7s" begin="0.5s" repeatCount="indefinite"/></path></g>
<!-- criatura / silueta decorativa -->
<g transform="translate(700,150)">
  <path d="M0 140 C-20 60 40 0 120 20 C190 38 230 110 190 200 C150 280 40 280 0 140 Z" fill="url(#r)"/>
  <path d="M60 30 C70 -10 120 -20 140 10 C120 8 90 14 80 40 Z" fill="#8f2b2b"/>
  <circle cx="132" cy="68" r="7" fill="#f4ece6"/><circle cx="132" cy="68" r="3" fill="#0d1f20"/>
  <path d="M30 230 C10 270 60 290 90 262" fill="none" stroke="#8f2b2b" stroke-width="14" stroke-linecap="round"/>
</g>
<circle cx="700" cy="90" r="9" fill="#f4ece6" opacity="0.85"><animate attributeName="cy" values="90;60;90" dur="4s" repeatCount="indefinite"/></circle><circle cx="730" cy="55" r="6" fill="#f4ece6" opacity="0.85"><animate attributeName="cy" values="55;25;55" dur="5s" repeatCount="indefinite"/></circle><circle cx="760" cy="30" r="4" fill="#f4ece6" opacity="0.85"><animate attributeName="cy" values="30;0;30" dur="6s" repeatCount="indefinite"/></circle><circle cx="640" cy="60" r="5" fill="#f4ece6" opacity="0.85"><animate attributeName="cy" values="60;30;60" dur="7s" repeatCount="indefinite"/></circle>
<!-- jarra -->
<g transform="translate(560,170)">
  <rect x="0" y="0" width="64" height="74" rx="8" fill="#8f2b2b"/>
  <rect x="0" y="14" width="64" height="8" fill="#f4ece6"/><rect x="0" y="52" width="64" height="8" fill="#f4ece6"/>
  <path d="M64 18 C92 18 92 56 64 56" fill="none" stroke="#f4ece6" stroke-width="8"/>
  <animateTransform attributeName="transform" type="translate" values="560,170;560,162;560,170" dur="4s" repeatCount="indefinite"/>
</g>
<!-- título -->
<text x="56" y="190" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="104" font-weight="800" font-style="italic" fill="#f4ece6" letter-spacing="-2">Portfolio</text>
<rect x="60" y="212" width="0" height="6" rx="3" fill="#d64545"><animate attributeName="width" values="0;330;330" keyTimes="0;.5;1" dur="2.2s" fill="freeze"/></rect>
<text x="58" y="268" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="34" font-weight="700" fill="#e05a5a">Andrés Felipe Joya Buitrago</text>
<text x="58" y="308" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="20" fill="#9db7b4">Ingeniero en Sistemas · Desarrollador Fullstack · Bucaramanga, Colombia</text>
<g font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="700">
  <rect x="58" y="340" width="112" height="34" rx="17" fill="#d64545"/><text x="114" y="362" text-anchor="middle" fill="#0d1f20">Laravel</text>
  <rect x="182" y="340" width="112" height="34" rx="17" fill="none" stroke="#d64545" stroke-width="2"/><text x="238" y="362" text-anchor="middle" fill="#f4ece6">React</text>
  <rect x="306" y="340" width="112" height="34" rx="17" fill="none" stroke="#d64545" stroke-width="2"/><text x="362" y="362" text-anchor="middle" fill="#f4ece6">Python</text>
  <rect x="430" y="340" width="112" height="34" rx="17" fill="none" stroke="#d64545" stroke-width="2"/><text x="486" y="362" text-anchor="middle" fill="#f4ece6">Docker</text>
</g>
<text x="58" y="414" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="18" font-style="italic" fill="#f4ece6">“Iré hasta los límites de lo que mi mente permita, y mi alma desee”</text>
</svg>